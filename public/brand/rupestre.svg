  <g fill="none" stroke-width="4">
    <circle cx="330" cy="200" r="7" fill="black"/>
    <path d="M330 207v26M330 233l-9 20M330 233l9 20M330 214l-16 10M330 214l16 10"/>
    <circle cx="366" cy="200" r="7" fill="black"/>
    <path d="M366 207v26M366 233l-9 20M366 233l9 20M366 214l-20 10M366 214l16-12"/>
    <circle cx="402" cy="204" r="6" fill="black"/>
    <path d="M402 210v22M402 232l-8 18M402 232l8 18M402 216l-20 8M402 216l14 10"/>
  </g>
  <!-- sol -->
  <g fill="none" stroke-width="4">
    <circle cx="90" cy="340" r="16"/>
    <circle cx="90" cy="340" r="5" fill="black"/>
    <path d="M90 314v-12M90 366v12M64 340h-12M116 340h12M72 322l-8-8M108 358l8 8M108 322l8-8M72 358l-8 8"/>
  </g>
  <!-- hileras de puntos (cuentas) -->
  <g stroke="none">
    <circle cx="200" cy="330" r="4"/><circle cx="216" cy="330" r="4"/><circle cx="232" cy="330" r="4"/><circle cx="248" cy="330" r="4"/>
    <circle cx="208" cy="346" r="4"/><circle cx="224" cy="346" r="4"/><circle cx="240" cy="346" r="4"/>
  </g>
  <!-- greca de escalones -->
  <path d="M290 400h14v-14h14v-14h14v28h-14v-14" fill="none" stroke-width="4"/>
  <!-- mano pequeña en negativo (contorno) -->
  <g transform="translate(410 420) rotate(18)" fill="none" stroke-width="3">
    <ellipse cx="0" cy="12" rx="12" ry="14"/>
    <path d="M-10-4v-14M-4-8v-18M2-8v-17M8-4v-13M11 8l10-8"/>
  </g>
  <!-- serpiente ondulante -->
  <path d="M150 440c12-14 24 14 36 0s24 14 36 0 24 14 36 0" fill="none" stroke-width="5"/>
  <circle cx="262" cy="436" r="5" stroke="none"/>
