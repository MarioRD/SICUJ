<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" fill="black" stroke="black" stroke-linecap="round" stroke-linejoin="round">
  <!-- Motivos de pintura rupestre (originales) para el fondo: se usan como máscara. -->
  <!-- mano -->
  <g transform="translate(70 70) rotate(-12)" stroke="none">
    <ellipse cx="0" cy="18" rx="17" ry="20"/>
    <rect x="-17" y="-22" width="7" height="26" rx="3.5"/>
    <rect x="-8" y="-30" width="7" height="32" rx="3.5"/>
    <rect x="1" y="-28" width="7" height="30" rx="3.5"/>
    <rect x="10" y="-20" width="6.5" height="24" rx="3.2"/>
    <rect x="13" y="8" width="6" height="20" rx="3" transform="rotate(-48 16 18)"/>
  </g>
  <!-- espiral -->
  <path d="M300 60c0-6 9-7 12-1 4 9-6 18-16 15-14-4-16-23-4-32 15-11 37-3 40 16 3 22-17 38-38 34" fill="none" stroke-width="4"/>
  <!-- venado -->
  <g fill="none" stroke-width="4">
    <path d="M150 220h60c6 0 10-6 12-12"/>
    <path d="M222 208l6-14M226 196l10-6M228 194l-4-10M222 198l-10-8"/>
    <path d="M158 220l-8 26M170 220l4 26M196 220l-6 26M206 220l8 26"/>
    <path d="M150 220l-8-8"/>
  </g>
